[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoom-openkkt"
version = "0.1.0"
description = "Local, read-only KakaoTalk bridge for personal AI assistants"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["cryptography>=46,<51"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
openkkt = "openkkt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openkkt = ["gui.html"]
